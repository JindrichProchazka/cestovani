<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tarvisio | Kam vyrazit?</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f3ef;
      color: #111;
    }

    header {
      padding: 26px 34px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      font-size: 13px;
      text-decoration: none;
      color: #666;
    }

    .back-link:hover {
      color: #111;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 82px);
      line-height: 0.95;
      letter-spacing: -3px;
    }

    .title-block p {
      margin: 16px 0 0;
      max-width: 780px;
      color: #666;
      line-height: 1.55;
      font-size: 15px;
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tag {
      border: 1px solid #ccc;
      border-radius: 999px;
      padding: 10px 16px;
      white-space: nowrap;
      font-size: 13px;
    }

    .controls {
      padding: 0 34px 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-button {
      border: 1px solid #ccc;
      background: transparent;
      color: #111;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-button:hover {
      background: #e8e7e2;
    }

    .filter-button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    .main {
      padding: 0 24px 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 16px;
      min-height: 680px;
    }

    .sidebar {
      overflow-y: auto;
      padding: 4px 4px 4px 0;
    }

    .section-label {
      margin: 4px 0 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: #888;
    }

    .place-card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s ease;
    }

    .place-card:hover {
      border-color: #bbb;
      transform: translateY(-1px);
    }

    .place-card.active {
      border-color: #111;
    }

    .place-card.hidden {
      display: none;
    }

    .place-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 50%;
      background: #f1f1ee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .place-info h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
    }

    .type {
      margin-top: 4px;
      color: #888;
      font-size: 12px;
    }

    .tags {
      margin-top: 8px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .small-tag {
      font-size: 10px;
      padding: 4px 7px;
      border-radius: 999px;
      background: #f1f1ee;
      color: #666;
    }

    .description {
      margin: 12px 0 0;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    .map-shell {
      position: relative;
      background: white;
      border-radius: 30px;
      padding: 7px;
      min-width: 0;
    }

    #map {
      height: 100%;
      min-height: 680px;
      border-radius: 24px;
      overflow: hidden;
    }

    .leaflet-bar {
      border: none !important;
      box-shadow: none !important;
    }

    .leaflet-bar a {
      border: none !important;
      margin-bottom: 4px;
      border-radius: 50% !important;
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      background: rgba(255,255,255,0.95) !important;
      color: #111 !important;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .leaflet-control-zoom {
      margin-top: 20px !important;
      margin-left: 20px !important;
    }

    .map-switcher {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(255,255,255,0.92);
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .map-switcher button {
      border: 0;
      background: transparent;
      padding: 9px 13px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .map-switcher button.active {
      background: #111;
      color: white;
    }

    .custom-marker {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #111;
      color: white;
      border: 3px solid white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    @media (max-width: 900px) {
      header {
        padding: 22px 18px 16px;
        flex-direction: column;
      }

      .title-block h1 {
        letter-spacing: -2px;
      }

      .meta {
        justify-content: flex-start;
      }

      .controls {
        padding: 0 18px 16px;
      }

      .main {
        padding: 0 10px 18px;
      }

      .layout {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .map-shell {
        order: 1;
        height: 58vh;
        min-height: 420px;
      }

      #map {
        min-height: 0;
        height: 100%;
      }

      .sidebar {
        order: 2;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="title-block">

    <a href="../index.html" class="back-link">
      ← Zpět na hlavní mapu
    </a>

    <h1>TARVISIO</h1>

    <p>
      Malé horské město, které mám velmi rád. Je turistické, ale pořád
      příjemné na krátkou zastávku, kafe, zmrzlinu nebo doplnění zásob.
      Navíc mám vyzkoušených pár míst, která se při cestě přes Tarvisio
      opakovaně hodí.
    </p>

  </div>

  <div class="meta">
    <div class="tag">🇮🇹 Itálie · Friuli-Venezia Giulia</div>
  </div>

</header>


<div class="controls">
  <button class="filter-button active" data-filter="all">Vše</button>
  <button class="filter-button" data-filter="food">☕ Kafe & jídlo</button>
  <button class="filter-button" data-filter="parking">🅿️ Parkování</button>
  <button class="filter-button" data-filter="practical">🔧 Praktické</button>
</div>


<main class="main">

  <div class="layout">

    <aside class="sidebar" id="placeList">

      <div class="section-label">
        Místa v Tarvisiu
      </div>

    </aside>


    <section class="map-shell">

      <div id="map"></div>

      <div class="map-switcher">
        <button id="topoButton" class="active">Turistická</button>
        <button id="classicButton">Klasická</button>
      </div>

    </section>

  </div>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const places = [

  {
    id: "cafe-old",
    name: "Kavárna se skvělou zmrzlinou",
    type: "food",
    typeLabel: "Kavárna · Zmrzlina",
    icon: "🍦",
    lat: 46.5039017,
    lon: 13.5849883,
    tags: ["espresso", "zmrzlina", "wc", "turistické"],
    description:
      "Kavárna, kam jsem dřív chodil velmi rád. Už není tak levná jako bývala a espresso bych dal přibližně 7,5/10. Je poměrně populární mezi turisty. Hlavní důvod návštěvy je ale zmrzlina kolem 2 €, která patří k nejlepším, co jsem zatím měl. WC nechávám bez spoileru."
  },

  {
    id: "parking-supermarket",
    name: "Parkování u supermarketu",
    type: "parking",
    typeLabel: "Parkování · Supermarket",
    icon: "🅿️",
    lat: 46.5036808,
    lon: 13.5851289,
    tags: ["zdarma", "supermarket", "malá kapacita"],
    description:
      "Neplacené parkování přímo před supermarketem. Kapacita je malá, přibližně kolem 8 míst. Výhoda je možnost rovnou doplnit jídlo a další zásoby."
  },

  {
    id: "cafe-local",
    name: "Lokální kavárna se zahrádkou",
    type: "food",
    typeLabel: "Kavárna · Pečivo",
    icon: "☕",
    lat: 46.5042531,
    lon: 13.5773072,
    tags: ["espresso", "1,30 €", "zahrádka", "pečivo", "wc"],
    description:
      "Novější objev a momentálně moje oblíbenější varianta. Espresso stálo při návštěvě 1,30 €, místo má výraznější lokální atmosféru a velkou zahrádku. Běžně tu sedí místní třeba u vína. Platba hotově i kartou. Doporučený byl croissant s čokoládou. WC nabízí jak klasickou, tak tureckou variantu."
  },

  {
    id: "parking-local-cafe",
    name: "Velké štěrkové parkoviště",
    type: "parking",
    typeLabel: "Parkování",
    icon: "🅿️",
    lat: 46.5036375,
    lon: 13.5777097,
    tags: ["zdarma", "štěrk", "velká kapacita", "kavárna"],
    description:
      "Velké štěrkové parkoviště zdarma hned za rohem od lokální kavárny. Praktická varianta, pokud se člověk nechce motat po centru."
  },

  {
    id: "zamolo",
    name: "Zamolo – autoservis",
    type: "practical",
    typeLabel: "Autoservis · Doporučení",
    icon: "🔧",
    lat: 46.5047122,
    lon: 13.5719803,
    tags: ["autoservis", "rodinná firma", "osobně vyzkoušeno"],
    description:
      "Rodinný autoservis, se kterým mám výbornou zkušenost. Táta, syn a manželka na recepci, všichni velmi příjemní. Odstranění chyby AdBlue u Peugeotu Rifter 2019 stálo 30 €, přičemž předem slíbili cenu maximálně 50 €. Když pršelo, půjčili nám i deštník. V případě problémů s autem bych je bez problému zkusil znovu."
  }

];


/* =========================
   MAP
========================= */

const map = L.map("map").setView(
  [46.5038, 13.5808],
  15
);


const topoLayer = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution:
      "Map data © OpenStreetMap contributors, SRTM | Map style © OpenTopoMap"
  }
);


const classicLayer = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "© OpenStreetMap contributors"
  }
);


topoLayer.addTo(map);


/* =========================
   MARKERS
========================= */

const markers = {};


function createMarkerIcon(place) {

  return L.divIcon({
    className: "",
    html: `
      <div class="custom-marker">
        ${place.icon}
      </div>
    `,
    iconSize: [38, 38],
    iconAnchor: [19, 19],
    popupAnchor: [0, -21]
  });

}


places.forEach(place => {

  const marker = L.marker(
    [place.lat, place.lon],
    {
      icon: createMarkerIcon(place)
    }
  );

  marker.bindPopup(`
    <div style="width:220px;">

      <strong style="font-size:15px;">
        ${place.name}
      </strong>

      <div style="
        margin-top:3px;
        font-size:12px;
        color:#777;
      ">
        ${place.typeLabel}
      </div>

      <p style="
        margin:10px 0 0;
        line-height:1.45;
        font-size:13px;
      ">
        ${place.description}
      </p>

    </div>
  `);

  marker.addTo(map);

  markers[place.id] = marker;

});


/* =========================
   LIST
========================= */

const placeList =
  document.getElementById("placeList");


places.forEach(place => {

  const card =
    document.createElement("div");

  card.className = "place-card";
  card.dataset.id = place.id;
  card.dataset.type = place.type;


  const tagsHtml = place.tags
    .map(
      tag =>
        `<span class="small-tag">${tag}</span>`
    )
    .join("");


  card.innerHTML = `

    <div class="place-header">

      <div class="icon">
        ${place.icon}
      </div>

      <div class="place-info">

        <h3>
          ${place.name}
        </h3>

        <div class="type">
          ${place.typeLabel}
        </div>

        <div class="tags">
          ${tagsHtml}
        </div>

      </div>

    </div>

    <p class="description">
      ${place.description}
    </p>

  `;


  card.addEventListener("click", () => {

    document
      .querySelectorAll(".place-card")
      .forEach(
        c => c.classList.remove("active")
      );

    card.classList.add("active");


    map.flyTo(
      [place.lat, place.lon],
      17,
      {
        duration: 1.1
      }
    );


    setTimeout(
      () => {
        markers[place.id].openPopup();
      },
      1000
    );

  });


  placeList.appendChild(card);

});


/* =========================
   FILTERS
========================= */

const filterButtons =
  document.querySelectorAll(".filter-button");


filterButtons.forEach(button => {

  button.addEventListener("click", () => {

    filterButtons.forEach(
      btn => btn.classList.remove("active")
    );

    button.classList.add("active");

    const filter =
      button.dataset.filter;


    places.forEach(place => {

      const card =
        document.querySelector(
          `.place-card[data-id="${place.id}"]`
        );

      const marker =
        markers[place.id];

      const visible =
        filter === "all" ||
        place.type === filter;


      card.classList.toggle(
        "hidden",
        !visible
      );


      if (visible) {

        if (!map.hasLayer(marker)) {
          marker.addTo(map);
        }

      } else {

        if (map.hasLayer(marker)) {
          map.removeLayer(marker);
        }

      }

    });

  });

});


/* =========================
   MAP SWITCHER
========================= */

const topoButton =
  document.getElementById("topoButton");

const classicButton =
  document.getElementById("classicButton");


topoButton.addEventListener("click", () => {

  if (!map.hasLayer(topoLayer)) {

    map.removeLayer(classicLayer);
    topoLayer.addTo(map);

  }

  topoButton.classList.add("active");
  classicButton.classList.remove("active");

});


classicButton.addEventListener("click", () => {

  if (!map.hasLayer(classicLayer)) {

    map.removeLayer(topoLayer);
    classicLayer.addTo(map);

  }

  classicButton.classList.add("active");
  topoButton.classList.remove("active");

});

</script>

</body>
</html>
