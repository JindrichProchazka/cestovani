<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kam vyrazit?</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f3ef;
      color: #111111;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 30px 42px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 30px;
    }

    .brand {
      max-width: 700px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 76px);
      line-height: 0.95;
      letter-spacing: -3px;
      font-weight: 700;
    }

    .brand p {
      margin: 16px 0 0;
      max-width: 520px;
      font-size: 16px;
      line-height: 1.5;
      color: #666;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    .nav-button {
      appearance: none;
      border: 1px solid #cfcfc9;
      background: transparent;
      color: #111;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .nav-button:hover {
      background: #111;
      color: white;
      border-color: #111;
    }

    .nav-button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      padding: 0 26px 26px;
    }

    .travel-container {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 18px;
      min-height: 680px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      padding: 20px 10px 20px 4px;
    }

    .sidebar-top {
      margin-bottom: 32px;
    }

    .eyebrow {
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: #888;
    }

    .sidebar h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .sidebar-description {
      margin: 10px 0 0;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty-state {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid #d7d6d0;
    }

    .empty-state p {
      margin: 0;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .wishlist {
      margin-top: 46px;
    }

    .wishlist-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #d7d6d0;
      font-size: 14px;
      font-weight: 600;
    }

    .wishlist-title span:last-child {
      font-size: 18px;
      font-weight: normal;
    }

    /* =========================
       MAP
    ========================= */

    .map-shell {
      position: relative;
      min-width: 0;
      padding: 7px;
      background: #ffffff;
      border-radius: 30px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 680px;
      border-radius: 24px;
      overflow: hidden;
      background: #ddd;
    }

    /* Leaflet controls */

    .leaflet-bar {
      border: none !important;
      box-shadow: none !important;
    }

    .leaflet-bar a {
      border: none !important;
      margin-bottom: 4px;
      border-radius: 50% !important;
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      background: rgba(255,255,255,0.94) !important;
      color: #111 !important;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .leaflet-control-zoom {
      margin-top: 20px !important;
      margin-left: 20px !important;
    }

    /* custom map switch */

    .map-switcher {
      position: absolute;
      z-index: 1000;
      top: 20px;
      right: 20px;

      display: flex;
      gap: 4px;

      padding: 4px;

      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);

      border-radius: 999px;

      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .map-switcher button {
      border: 0;
      background: transparent;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .map-switcher button.active {
      background: #111;
      color: white;
    }

    /* =========================
       FOOTER NOTE
    ========================= */

    .bottom-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 4px 0;
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      header {
        padding: 24px 20px 20px;
        flex-direction: column;
      }

      .brand h1 {
        letter-spacing: -2px;
      }

      nav {
        width: 100%;
      }

      .nav-button {
        flex: 1;
      }

      .main {
        padding: 0 12px 20px;
      }

      .travel-container {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .map-shell {
        order: 1;
        height: 60vh;
        min-height: 420px;
        border-radius: 22px;
      }

      #map {
        min-height: 0;
        height: 100%;
        border-radius: 17px;
      }

      .sidebar {
        order: 2;
        padding: 18px 8px;
      }

      .map-switcher {
        top: 16px;
        right: 16px;
      }

      .bottom-line {
        display: none;
      }
    }

  </style>
</head>

<body>

<header>

  <div class="brand">
    <h1>KAM VYRAZIT?</h1>
    <p>
      Místa, která stojí za cestu. Výlety, hory, koupání,
      cyklistika a poznámky, které nechci příště hledat znovu.
    </p>
  </div>

  <nav>
    <button class="nav-button active">
      Mapa
    </button>

    <button class="nav-button">
      Chci navštívit
    </button>
  </nav>

</header>


<main class="main">

  <div class="travel-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-top">

        <div class="eyebrow">
          Explore
        </div>

        <h2>Místa</h2>

        <p class="sidebar-description">
          Vyber zemi nebo oblast a zobraz místa na mapě.
        </p>

      </div>


      <div class="empty-state">

  <div class="eyebrow">
    Chorvatsko
  </div>

  <a
    href="places/pula.html"
    style="
      display: block;
      padding: 14px 0;
      border-top: 1px solid #d7d6d0;
      text-decoration: none;
      font-weight: 600;
    "
  >
    🇭🇷 Pula
  </a>

</div>

      <div class="wishlist">

        <div class="wishlist-title">
          <span>Chci navštívit</span>
          <span>→</span>
        </div>

      </div>

    </aside>


    <!-- MAP -->

    <section class="map-shell">

      <div id="map"></div>

      <div class="map-switcher">

        <button id="topoButton" class="active">
          Turistická
        </button>

        <button id="classicButton">
          Klasická
        </button>

      </div>

    </section>

  </div>


  <div class="bottom-line">

    <span>
      Cestování / Evropa
    </span>

    <span>
      Mapa & poznámky
    </span>

  </div>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /* =========================
     MAP
  ========================= */

  const map = L.map("map", {
    zoomControl: true
  }).setView([46.3, 13.7], 6);


  /* TURISTICKÁ MAPA */

  const topoLayer = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 17,
      attribution:
        'Map data © OpenStreetMap contributors, SRTM | Map style © OpenTopoMap'
    }
  );


  /* KLASICKÁ MAPA */

  const classicLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        "© OpenStreetMap contributors"
    }
  );


  topoLayer.addTo(map);

/* =========================
   DESTINACE
========================= */

const pulaIcon = L.divIcon({
  className: "",
  html: `
    <div style="
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #111;
      color: white;
      border: 3px solid white;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    ">
      🇭🇷
    </div>
  `,
  iconSize: [42, 42],
  iconAnchor: [21, 21],
  popupAnchor: [0, -22]
});


const pulaMarker = L.marker(
  [44.8666, 13.8496],
  {
    icon: pulaIcon
  }
).addTo(map);


pulaMarker.bindPopup(`
  <div style="min-width: 210px;">

    <strong style="font-size: 16px;">
      Pula
    </strong>

    <div style="
      margin-top: 4px;
      font-size: 12px;
      color: #777;
    ">
      Chorvatsko · Istrie
    </div>

    <p style="
      margin: 10px 0;
      font-size: 13px;
      line-height: 1.45;
    ">
      Historické centrum, koupání, útesy, parkování zdarma a praktická místa.
    </p>

    <a
      href="places/pula.html"
      style="
        display: inline-block;
        margin-top: 4px;
        font-weight: 600;
        text-decoration: none;
        color: #111;
      "
    >
      Otevřít Pulu →
    </a>

  </div>
`);
  
  /* =========================
     MAP SWITCHER
  ========================= */

  const topoButton =
    document.getElementById("topoButton");

  const classicButton =
    document.getElementById("classicButton");


  topoButton.addEventListener("click", function() {

    if (!map.hasLayer(topoLayer)) {

      map.removeLayer(classicLayer);

      topoLayer.addTo(map);

    }

    topoButton.classList.add("active");
    classicButton.classList.remove("active");

  });


  classicButton.addEventListener("click", function() {

    if (!map.hasLayer(classicLayer)) {

      map.removeLayer(topoLayer);

      classicLayer.addTo(map);

    }

    classicButton.classList.add("active");
    topoButton.classList.remove("active");

  });

</script>

</body>
</html>
