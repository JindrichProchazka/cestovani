<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kam vyrazit?</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f3ef;
      color: #111111;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 30px 42px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 30px;
    }

    .brand {
      max-width: 700px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 76px);
      line-height: 0.95;
      letter-spacing: -3px;
      font-weight: 700;
    }

    .brand p {
      margin: 16px 0 0;
      max-width: 520px;
      font-size: 16px;
      line-height: 1.5;
      color: #666;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    .nav-button {
      appearance: none;
      border: 1px solid #cfcfc9;
      background: transparent;
      color: #111;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .nav-button:hover {
      background: #111;
      color: white;
      border-color: #111;
    }

    .nav-button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      padding: 0 26px 26px;
    }

    .travel-container {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 18px;
      min-height: 680px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      padding: 20px 10px 20px 4px;
    }

    .sidebar-top {
      margin-bottom: 20px;
    }

    .eyebrow {
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: #888;
    }

    .sidebar h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .sidebar-description {
      margin: 10px 0 0;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    .country-group {
      margin-top: 26px;
    }

    .country-name {
      padding-bottom: 10px;
      border-bottom: 1px solid #d7d6d0;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: #888;
    }

    .destination-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 2px;
      border-bottom: 1px solid #e1e0db;
      text-decoration: none;
      color: #111;
      font-size: 14px;
      font-weight: 600;
      transition: 0.15s ease;
    }

    .destination-link:hover {
      padding-left: 7px;
    }

    .destination-icon {
      width: 25px;
      text-align: center;
    }

    .wishlist {
      margin-top: 46px;
    }

    .wishlist-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #d7d6d0;
      font-size: 14px;
      font-weight: 600;
    }

    .wishlist-title span:last-child {
      font-size: 18px;
      font-weight: normal;
    }

    /* =========================
       MAP
    ========================= */

    .map-shell {
      position: relative;
      min-width: 0;
      padding: 7px;
      background: #ffffff;
      border-radius: 30px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 680px;
      border-radius: 24px;
      overflow: hidden;
      background: #ddd;
    }

    .leaflet-bar {
      border: none !important;
      box-shadow: none !important;
    }

    .leaflet-bar a {
      border: none !important;
      margin-bottom: 4px;
      border-radius: 50% !important;
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      background: rgba(255,255,255,0.94) !important;
      color: #111 !important;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .leaflet-control-zoom {
      margin-top: 20px !important;
      margin-left: 20px !important;
    }

    .map-switcher {
      position: absolute;
      z-index: 1000;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .map-switcher button {
      border: 0;
      background: transparent;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .map-switcher button.active {
      background: #111;
      color: white;
    }

    /* =========================
       FOOTER NOTE
    ========================= */

    .bottom-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 4px 0;
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      header {
        padding: 24px 20px 20px;
        flex-direction: column;
      }

      .brand h1 {
        letter-spacing: -2px;
      }

      nav {
        width: 100%;
      }

      .nav-button {
        flex: 1;
      }

      .main {
        padding: 0 12px 20px;
      }

      .travel-container {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .map-shell {
        order: 1;
        height: 60vh;
        min-height: 420px;
        border-radius: 22px;
      }

      #map {
        min-height: 0;
        height: 100%;
        border-radius: 17px;
      }

      .sidebar {
        order: 2;
        padding: 18px 8px;
      }

      .map-switcher {
        top: 16px;
        right: 16px;
      }

      .bottom-line {
        display: none;
      }
    }

  </style>
</head>

<body>

<header>

  <div class="brand">

    <h1>KAM VYRAZIT?</h1>

    <p>
      Místa, která stojí za cestu. Výlety, hory, koupání,
      cyklistika a poznámky, které nechci příště hledat znovu.
    </p>

  </div>

  <nav>

    <button class="nav-button active">
      Mapa
    </button>

    <button class="nav-button">
      Chci navštívit
    </button>

  </nav>

</header>


<main class="main">

  <div class="travel-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-top">

        <div class="eyebrow">
          Explore
        </div>

        <h2>Místa</h2>

        <p class="sidebar-description">
          Vyber zemi nebo oblast a zobraz místa na mapě.
        </p>

      </div>


      <div id="destinationList"></div>


      <div class="wishlist">

        <div class="wishlist-title">
          <span>Chci navštívit</span>
          <span>→</span>
        </div>

      </div>

    </aside>


    <!-- MAP -->

    <section class="map-shell">

      <div id="map"></div>

      <div class="map-switcher">

        <button id="topoButton" class="active">
          Turistická
        </button>

        <button id="classicButton">
          Klasická
        </button>

      </div>

    </section>

  </div>


  <div class="bottom-line">

    <span>
      Cestování / Evropa
    </span>

    <span>
      Mapa & poznámky
    </span>

  </div>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   MAP
========================= */

const map = L.map("map", {
  zoomControl: true
}).setView([46.15, 13.65], 7);


/* TURISTICKÁ MAPA */

const topoLayer = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution:
      "Map data © OpenStreetMap contributors, SRTM | Map style © OpenTopoMap"
  }
);


/* KLASICKÁ MAPA */

const classicLayer = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "© OpenStreetMap contributors"
  }
);


topoLayer.addTo(map);


/* =========================
   DESTINACE
========================= */

const destinations = [

  {
    name: "Dobratsch",
    country: "Rakousko",
    region: "Korutany",
    icon: "🥾",
    lat: 46.6032406,
    lon: 13.6728044,
    page: "places/dobratsch.html",
    description:
      "Prudší hike z Bad Bleibergu do vrcholové oblasti s výhledem směrem na Julské Alpy.",
    tags: ["Hike", "Výhled"]
  },

  {
    name: "Millstätter See",
    country: "Rakousko",
    region: "Korutany",
    icon: "🚴",
    lat: 46.8110856,
    lon: 13.5481222,
    page: "places/millstatter-see.html",
    description:
      "Jezero, koupání, paddleboard a přibližně 40km cyklistický okruh.",
    tags: ["Cyklistika", "Paddleboard", "Koupání"]
  },

  {
    name: "Sušec",
    country: "Slovinsko",
    region: "Soča",
    icon: "💧",
    lat: 46.2925364,
    lon: 13.4876325,
    page: "places/susec.html",
    description:
      "Kaskáda vodopádů a canyoningová lokalita poblíž Srpenice.",
    tags: ["Vodopády", "Příroda"]
  },

  {
    name: "Tolmin",
    country: "Slovinsko",
    region: "Soča",
    icon: "🌊",
    lat: 46.1818,
    lon: 13.7425,
    page: "places/tolmin.html",
    description:
      "Vodopád Beri, koupání v Soče, parkování, kafe a praktická místa.",
    tags: ["Vodopád", "Koupání", "Kafe"]
  },

  {
    name: "Most na Soči",
    country: "Slovinsko",
    region: "Soča",
    icon: "🛶",
    lat: 46.1532875,
    lon: 13.7401850,
    page: "places/most-na-soci.html",
    description:
      "Klidnější místo na Soče vhodné na paddleboard, koupání a skákání.",
    tags: ["Paddleboard", "Koupání"]
  },

  {
    name: "Tarvisio",
    country: "Itálie",
    region: "Friuli-Venezia Giulia",
    icon: "☕",
    lat: 46.5038,
    lon: 13.5808,
    page: "places/tarvisio.html",
    description:
      "Malé horské město, kafe, výborná zmrzlina, parkování a praktické tipy.",
    tags: ["Kafe", "Jídlo", "Praktické"]
  },

  {
    name: "Pula",
    country: "Chorvatsko",
    region: "Istrie",
    icon: "🏖️",
    lat: 44.8666,
    lon: 13.8496,
    page: "places/pula.html",
    description:
      "Historické centrum, útesy, koupání, parkování zdarma a praktická místa.",
    tags: ["Koupání", "Město", "Praktické"]
  }

];


/* =========================
   MARKERY DESTINACÍ
========================= */

function createDestinationIcon(destination) {

  return L.divIcon({

    className: "",

    html: `
      <div style="
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #111;
        color: white;
        border: 3px solid white;
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
      ">
        ${destination.icon}
      </div>
    `,

    iconSize: [44, 44],
    iconAnchor: [22, 22],
    popupAnchor: [0, -24]

  });

}


destinations.forEach(destination => {

  const tags = destination.tags
    .map(tag => `
      <span style="
        display: inline-block;
        margin: 3px 3px 0 0;
        padding: 4px 7px;
        border-radius: 999px;
        background: #f1f1ee;
        color: #666;
        font-size: 10px;
      ">
        ${tag}
      </span>
    `)
    .join("");


  const marker = L.marker(
    [destination.lat, destination.lon],
    {
      icon: createDestinationIcon(destination)
    }
  ).addTo(map);


  marker.bindPopup(`
    <div style="
      min-width: 220px;
      max-width: 260px;
    ">

      <strong style="font-size: 16px;">
        ${destination.name}
      </strong>

      <div style="
        margin-top: 4px;
        font-size: 12px;
        color: #777;
      ">
        ${destination.country} · ${destination.region}
      </div>

      <div style="margin-top: 7px;">
        ${tags}
      </div>

      <p style="
        margin: 10px 0;
        font-size: 13px;
        line-height: 1.45;
      ">
        ${destination.description}
      </p>

      <a
        href="${destination.page}"
        style="
          display: inline-block;
          margin-top: 3px;
          color: #111;
          text-decoration: none;
          font-weight: 600;
          font-size: 13px;
        "
      >
        Otevřít detail →
      </a>

    </div>
  `);

});


/* =========================
   SIDEBAR
========================= */

const destinationList =
  document.getElementById("destinationList");


const countries = [
  "Rakousko",
  "Slovinsko",
  "Itálie",
  "Chorvatsko"
];


countries.forEach(country => {

  const countryDestinations =
    destinations.filter(
      destination =>
        destination.country === country
    );


  if (countryDestinations.length === 0) {
    return;
  }


  const group =
    document.createElement("div");


  group.className =
    "country-group";


  group.innerHTML = `
    <div class="country-name">
      ${country}
    </div>
  `;


  countryDestinations.forEach(destination => {

    const link =
      document.createElement("a");


    link.href =
      destination.page;


    link.className =
      "destination-link";


    link.innerHTML = `
      <span class="destination-icon">
        ${destination.icon}
      </span>

      <span>
        ${destination.name}
      </span>
    `;


    group.appendChild(link);

  });


  destinationList.appendChild(group);

});


/* =========================
   MAP SWITCHER
========================= */

const topoButton =
  document.getElementById("topoButton");

const classicButton =
  document.getElementById("classicButton");


topoButton.addEventListener("click", function() {

  if (!map.hasLayer(topoLayer)) {

    map.removeLayer(classicLayer);
    topoLayer.addTo(map);

  }

  topoButton.classList.add("active");
  classicButton.classList.remove("active");

});


classicButton.addEventListener("click", function() {

  if (!map.hasLayer(classicLayer)) {

    map.removeLayer(topoLayer);
    classicLayer.addTo(map);

  }

  classicButton.classList.add("active");
  topoButton.classList.remove("active");

});

</script>

</body>
</html>
