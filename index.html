<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cestování</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      padding: 20px 30px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 82px);
    }

    .sidebar {
      background: white;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .country {
      margin-bottom: 24px;
    }

    .country h3 {
      margin-bottom: 8px;
    }

    .place {
      display: block;
      padding: 8px 10px;
      margin-bottom: 4px;
      background: #f2f2f2;
      border-radius: 6px;
      cursor: pointer;
    }

    .place:hover {
      background: #e5e5e5;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .wishlist {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 300px 1fr;
      }

      .sidebar {
        order: 2;
        border-right: none;
      }

      #map {
        order: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Kam vyrazit?</h1>
  <p>Místa, která stojí za návštěvu nebo která chci jednou navštívit.</p>
</header>

<div class="layout">

  <aside class="sidebar">

    <h2>Místa</h2>

    <div class="country">
      <h3>🇦🇹 Rakousko</h3>
      <div class="place" onclick="focusPlace('solden')">Sölden</div>
    </div>

    <div class="country">
      <h3>🇸🇮 Slovinsko</h3>
      <div class="place" onclick="focusPlace('soca')">Soča</div>
      <div class="place" onclick="focusPlace('triglav')">Triglav</div>
    </div>

    <div class="country">
      <h3>🇭🇷 Chorvatsko</h3>
      <div class="place" onclick="focusPlace('pula')">Pula</div>
    </div>

    <div class="country">
      <h3>🇮🇹 Itálie</h3>
      <div class="place" onclick="focusPlace('stelvio')">Passo dello Stelvio</div>
    </div>

    <div class="wishlist">
      <h2>Chci navštívit</h2>

      <div class="place" onclick="focusPlace('stelvio')">
        Passo dello Stelvio
      </div>

      <div class="place" onclick="focusPlace('solden')">
        Sölden
      </div>

      <div class="place" onclick="focusPlace('triglav')">
        Triglav
      </div>
    </div>

  </aside>

  <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const places = {

  pula: {
    name: "Pula",
    country: "Chorvatsko",
    lat: 44.8666,
    lon: 13.8496,
    zoom: 11,
    description: "Pobřeží, koupání, útesy a historické centrum."
  },

  soca: {
    name: "Soča",
    country: "Slovinsko",
    lat: 46.337,
    lon: 13.552,
    zoom: 10,
    description: "Údolí řeky Soča, koupání, hiking a cyklistika."
  },

  triglav: {
    name: "Triglav",
    country: "Slovinsko",
    lat: 46.3783,
    lon: 13.8369,
    zoom: 11,
    description: "Nejvyšší hora Slovinska – 2864 m."
  },

  stelvio: {
    name: "Passo dello Stelvio",
    country: "Itálie",
    lat: 46.5287,
    lon: 10.4531,
    zoom: 11,
    description: "Legendární horský průsmyk pro silniční cyklistiku."
  },

  solden: {
    name: "Sölden",
    country: "Rakousko",
    lat: 46.969,
    lon: 11.010,
    zoom: 11,
    description: "Ötztalské Alpy, ledovce a náročná silniční cyklistika."
  }

};

const map = L.map('map').setView([46.5, 13], 6);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }
).addTo(map);

const markers = {};

for (const id in places) {

  const place = places[id];

  const marker = L.marker([place.lat, place.lon])
    .addTo(map)
    .bindPopup(`
      <strong>${place.name}</strong><br>
      ${place.country}<br><br>
      ${place.description}<br><br>
      <a href="#">Detail místa →</a>
    `);

  markers[id] = marker;
}

function focusPlace(id) {

  const place = places[id];

  map.flyTo(
    [place.lat, place.lon],
    place.zoom,
    {
      duration: 1.5
    }
  );

  setTimeout(() => {
    markers[id].openPopup();
  }, 1500);

}

</script>

</body>
</html>
