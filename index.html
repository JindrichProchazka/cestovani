<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cestování</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      height: 86px;
      padding: 18px 28px;
      background: white;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
    }

    .brand p {
      margin: 5px 0 0;
      font-size: 14px;
      color: #6b7280;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .header-button {
      border: 1px solid #d1d5db;
      background: #ffffff;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    .header-button:hover {
      background: #f9fafb;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      height: calc(100vh - 86px);
    }

    .sidebar {
      background: white;
      border-right: 1px solid #e5e7eb;
      padding: 22px;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .sidebar-text {
      margin: 0 0 20px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty-box {
      border: 1px dashed #cbd5e1;
      background: #f8fafc;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    .section {
      margin-top: 28px;
    }

    .section h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .placeholder-row {
      height: 42px;
      border-radius: 8px;
      background: #f3f4f6;
      margin-bottom: 8px;
    }

    .map-wrapper {
      position: relative;
      padding: 14px;
      background: #e5e7eb;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    @media (max-width: 800px) {
      header {
        height: auto;
        align-items: flex-start;
        flex-direction: column;
      }

      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 55vh auto;
        height: auto;
      }

      .map-wrapper {
        order: 1;
        height: 55vh;
      }

      .sidebar {
        order: 2;
        border-right: none;
        border-top: 1px solid #e5e7eb;
      }

      .header-buttons {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    <h1>Kam vyrazit?</h1>
    <p>Moje místa, výlety, trasy a cestovatelské poznámky.</p>
  </div>

  <div class="header-buttons">
    <button class="header-button">Mapa</button>
    <button class="header-button">Chci navštívit</button>
  </div>

</header>

<div class="layout">

  <aside class="sidebar">

    <h2>Místa</h2>

    <p class="sidebar-text">
      Seznam destinací bude postupně rozdělený podle zemí a oblastí.
    </p>

    <div class="empty-box">
      Zatím nejsou přidaná žádná místa.
    </div>

    <div class="section">
      <h3>Země</h3>

      <div class="placeholder-row"></div>
      <div class="placeholder-row"></div>
      <div class="placeholder-row"></div>
    </div>

  </aside>

  <main class="map-wrapper">
    <div id="map"></div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  const map = L.map('map', {
    zoomControl: true
  }).setView([46.5, 13.5], 6);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }
  ).addTo(map);

</script>

</body>
</html>
