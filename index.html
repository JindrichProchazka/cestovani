<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kam vyrazit?</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f3ef;
      color: #111;
    }

    header {
      padding: 30px 42px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 30px;
    }

    .brand {
      max-width: 700px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(38px, 5vw, 76px);
      line-height: 0.95;
      letter-spacing: -3px;
    }

    .brand p {
      margin: 16px 0 0;
      max-width: 560px;
      font-size: 16px;
      line-height: 1.5;
      color: #666;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-button,
    .filter-button {
      appearance: none;
      border: 1px solid #cfcfc9;
      background: transparent;
      color: #111;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .nav-button:hover,
    .filter-button:hover {
      background: #e7e6e1;
    }

    .nav-button.active,
    .filter-button.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    .filters-wrap {
      padding: 0 42px 20px;
    }

    .filters-label {
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: #888;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .main {
      padding: 0 26px 26px;
    }

    .travel-container {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 18px;
      min-height: 680px;
    }

    .sidebar {
      padding: 20px 10px 20px 4px;
    }

    .sidebar-top {
      margin-bottom: 20px;
    }

    .eyebrow {
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: #888;
    }

    .sidebar h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .sidebar-description {
      margin: 10px 0 0;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    .country-group {
      margin-top: 26px;
    }

    .country-name {
      padding-bottom: 10px;
      border-bottom: 1px solid #d7d6d0;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: #888;
    }

    .destination-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 2px;
      border-bottom: 1px solid #e1e0db;
      text-decoration: none;
      color: #111;
      font-size: 14px;
      font-weight: 600;
      transition: 0.15s ease;
    }

    .destination-link:hover {
      padding-left: 7px;
    }

    .destination-icon {
      width: 25px;
      text-align: center;
    }

    .empty {
      margin-top: 24px;
      padding: 16px;
      border-radius: 16px;
      background: white;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .map-shell {
      position: relative;
      min-width: 0;
      padding: 7px;
      background: white;
      border-radius: 30px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 680px;
      border-radius: 24px;
      overflow: hidden;
      background: #ddd;
    }

    .leaflet-bar {
      border: none !important;
      box-shadow: none !important;
    }

    .leaflet-bar a {
      border: none !important;
      margin-bottom: 4px;
      border-radius: 50% !important;
      width: 42px !important;
      height: 42px !important;
      line-height: 42px !important;
      background: rgba(255,255,255,0.94) !important;
      color: #111 !important;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .leaflet-control-zoom {
      margin-top: 20px !important;
      margin-left: 20px !important;
    }

    .map-switcher {
      position: absolute;
      z-index: 1000;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 4px;
      padding: 4px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }

    .map-switcher button {
      border: 0;
      background: transparent;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .map-switcher button.active {
      background: #111;
      color: white;
    }

    .destination-marker,
    .point-marker {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #111;
      color: white;
      border: 3px solid white;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
    }

    .group-marker {
      min-width: 72px;
      height: 44px;
      padding: 0 15px;
      border-radius: 999px;
      background: #111;
      color: white;
      border: 3px solid white;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .bottom-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 4px 0;
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    @media (max-width: 850px) {
      header {
        padding: 24px 20px 20px;
        flex-direction: column;
      }

      .brand h1 {
        letter-spacing: -2px;
      }

      .top-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .filters-wrap {
        padding: 0 20px 18px;
      }

      .main {
        padding: 0 12px 20px;
      }

      .travel-container {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .map-shell {
        order: 1;
        height: 60vh;
        min-height: 420px;
        border-radius: 22px;
      }

      #map {
        min-height: 0;
        height: 100%;
        border-radius: 17px;
      }

      .sidebar {
        order: 2;
        padding: 18px 8px;
      }

      .map-switcher {
        top: 16px;
        right: 16px;
      }

      .bottom-line {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">
    <h1>KAM VYRAZIT?</h1>

    <p>
      Místa, která stojí za cestu. Výlety, hory, koupání,
      cyklistika a poznámky, které nechci příště hledat znovu.
    </p>
  </div>

  <div class="top-actions">
    <button class="nav-button active" data-status="all">
      Vše
    </button>

    <button class="nav-button" data-status="wishlist">
      ★ Chci navštívit
    </button>

    <button class="nav-button" data-status="visited">
      ✓ Navštíveno
    </button>
  </div>
</header>


<div class="filters-wrap">
  <div class="filters-label">
    Filtry
  </div>

  <div class="filters" id="categoryFilters"></div>
</div>


<main class="main">

  <div class="travel-container">

    <aside class="sidebar">

      <div class="sidebar-top">
        <div class="eyebrow">
          Explore
        </div>

        <h2>Místa</h2>

        <p class="sidebar-description" id="sidebarDescription">
          Vyber zemi nebo oblast a zobraz místa na mapě.
        </p>
      </div>

      <div id="destinationList"></div>

    </aside>


    <section class="map-shell">

      <div id="map"></div>

      <div class="map-switcher">
        <button id="topoButton" class="active">
          Turistická
        </button>

        <button id="classicButton">
          Klasická
        </button>
      </div>

    </section>

  </div>


  <div class="bottom-line">
    <span>Cestování / Evropa</span>
    <span>Mapa & poznámky</span>
  </div>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/places.js"></script>

<script>

/* =========================
   ZÁKLAD
========================= */

const map = L.map("map", {
  zoomControl: true
}).setView([46.15, 13.65], 6);


const topoLayer = L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 17,
    attribution:
      "Map data © OpenStreetMap contributors, SRTM | Map style © OpenTopoMap"
  }
);


const classicLayer = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution:
      "© OpenStreetMap contributors"
  }
);


topoLayer.addTo(map);


/* =========================
   KONFIGURACE TYPŮ
========================= */

const typeInfo = {
  coffee:       { label: "Kavárny", icon: "☕" },
  food:         { label: "Jídlo", icon: "🥐" },
  parking:      { label: "Parkování", icon: "🅿️" },
  waterfall:    { label: "Vodopády", icon: "💧" },
  swimming:     { label: "Koupání", icon: "🌊" },
  shower:       { label: "Sprchy", icon: "🚿" },
  toilet:       { label: "WC", icon: "🚻" },
  jumping:      { label: "Skákání", icon: "🧗" },
  hike:         { label: "Hike", icon: "🥾" },
  cycling:      { label: "Kolo", icon: "🚴" },
  paddleboard:  { label: "Paddleboard", icon: "🛶" },
  sleep:        { label: "Spaní", icon: "🛏️" },
  viewpoint:    { label: "Výhledy", icon: "⛰️" },
  sight:        { label: "Památky", icon: "🏛️" },
  service:      { label: "Servis", icon: "🔧" }
};


const destinationIcons = {
  hike: "🥾",
  cycling: "🚴",
  paddleboard: "🛶",
  swimming: "🌊",
  waterfall: "💧",
  coffee: "☕",
  mountain: "⛰️",
  sight: "🏛️"
};


/* =========================
   OBLASTI PRO ODDÁLENÍ
========================= */

const macroRegions = [
  {
    name: "Alpy & Jadran",
    countries: [
      "Rakousko",
      "Německo",
      "Slovinsko",
      "Itálie",
      "Chorvatsko"
    ]
  }
];


/* =========================
   VŠECHNY BODY
========================= */

const allPoints = [];


destinations.forEach(destination => {

  (destination.points || [])
    .forEach(point => {

      allPoints.push({
        ...point,

        destinationId: destination.id,
        destinationName: destination.name,
        destinationCountry: destination.country,
        destinationRegion: destination.region
      });

    });


  (destination.routes || [])
    .forEach(route => {

      allPoints.push({
        id: route.id,

        name: route.name,

        lat: destination.lat,
        lon: destination.lon,

        type: route.type,

        tags: [route.type],

        status: destination.status,

        destinationId: destination.id,
        destinationName: destination.name,
        destinationCountry: destination.country,
        destinationRegion: destination.region,

        description:
          route.type === "cycling"
            ? "Uložená cyklotrasa."
            : "Uložená turistická trasa."
      });

    });

});


/* =========================
   STAV FILTRŮ
========================= */

let selectedStatus = "all";
let selectedCategory = "all";


/* =========================
   LAYERS
========================= */

const continentLayer = L.layerGroup();
const macroLayer = L.layerGroup();
const countryLayer = L.layerGroup();
const destinationLayer = L.layerGroup();
const filteredPointLayer = L.layerGroup();


/* =========================
   IKONY
========================= */

function createRoundIcon(icon) {

  return L.divIcon({
    className: "",

    html: `
      <div class="destination-marker">
        ${icon}
      </div>
    `,

    iconSize: [44, 44],
    iconAnchor: [22, 22],
    popupAnchor: [0, -24]
  });

}


function createPointIcon(type) {

  const info =
    typeInfo[type] || {
      icon: "📍"
    };


  return L.divIcon({
    className: "",

    html: `
      <div class="point-marker">
        ${info.icon}
      </div>
    `,

    iconSize: [44, 44],
    iconAnchor: [22, 22],
    popupAnchor: [0, -24]
  });

}


function createGroupIcon(text, width = 90) {

  return L.divIcon({
    className: "",

    html: `
      <div
        class="group-marker"
        style="min-width:${width}px;"
      >
        ${text}
      </div>
    `,

    iconSize: [width, 44],
    iconAnchor: [width / 2, 22]
  });

}


/* =========================
   POMOCNÉ FUNKCE
========================= */

function destinationMatchesStatus(destination) {

  if (selectedStatus === "all") {
    return true;
  }

  return destination.status === selectedStatus;
}


function pointMatchesStatus(point) {

  if (selectedStatus === "all") {
    return true;
  }

  return point.status === selectedStatus;
}


function pointMatchesCategory(point) {

  if (selectedCategory === "all") {
    return true;
  }

  if (point.type === selectedCategory) {
    return true;
  }

  return (
    point.tags &&
    point.tags.includes(selectedCategory)
  );
}


function destinationContainsCategory(destination) {

  if (selectedCategory === "all") {
    return true;
  }


  if (
    destination.tags &&
    destination.tags.includes(selectedCategory)
  ) {
    return true;
  }


  return (destination.points || [])
    .some(point =>
      point.type === selectedCategory ||
      (
        point.tags &&
        point.tags.includes(selectedCategory)
      )
    ) ||
    (destination.routes || [])
      .some(route =>
        route.type === selectedCategory
      );

}


function getDestinationIcon(destination) {

  const tags =
    destination.tags || [];


  for (const tag of tags) {

    if (destinationIcons[tag]) {
      return destinationIcons[tag];
    }

  }


  return "📍";
}


function getVisibleDestinations() {

  return destinations.filter(destination => {

    return (
      destinationMatchesStatus(destination) &&
      destinationContainsCategory(destination)
    );

  });

}


function getVisiblePoints() {

  return allPoints.filter(point => {

    return (
      pointMatchesStatus(point) &&
      pointMatchesCategory(point)
    );

  });

}


/* =========================
   KONTINENT
========================= */

const europeMarker =
  L.marker(
    [50.3, 12.5],
    {
      icon:
        createGroupIcon(
          "EVROPA",
          100
        )
    }
  );


europeMarker.on("click", () => {

  map.flyTo(
    [47, 13],
    4,
    {
      duration: 1
    }
  );

});


europeMarker.addTo(
  continentLayer
);


/* =========================
   MAKROREGIONY
========================= */

function buildMacroRegions() {

  macroLayer.clearLayers();


  macroRegions.forEach(region => {

    const regionDestinations =
      getVisibleDestinations()
        .filter(destination =>
          region.countries.includes(
            destination.country
          )
        );


    if (
      regionDestinations.length === 0
    ) {
      return;
    }


    const lat =
      regionDestinations.reduce(
        (sum, item) =>
          sum + item.lat,
        0
      ) / regionDestinations.length;


    const lon =
      regionDestinations.reduce(
        (sum, item) =>
          sum + item.lon,
        0
      ) / regionDestinations.length;


    const marker =
      L.marker(
        [lat, lon],
        {
          icon:
            createGroupIcon(
              region.name.toUpperCase(),
              135
            )
        }
      );


    marker.on("click", () => {

      const bounds =
        L.latLngBounds(
          regionDestinations.map(
            destination => [
              destination.lat,
              destination.lon
            ]
          )
        );


      map.fitBounds(
        bounds,
        {
          padding: [90, 90],
          maxZoom: 6
        }
      );

    });


    marker.addTo(
      macroLayer
    );

  });

}


/* =========================
   ZEMĚ
========================= */

function buildCountries() {

  countryLayer.clearLayers();


  const visible =
    getVisibleDestinations();


  const countryNames =
    [...new Set(
      visible.map(
        destination =>
          destination.country
      )
    )];


  countryNames.forEach(country => {

    const countryDestinations =
      visible.filter(
        destination =>
          destination.country === country
      );


    const lat =
      countryDestinations.reduce(
        (sum, item) =>
          sum + item.lat,
        0
      ) / countryDestinations.length;


    const lon =
      countryDestinations.reduce(
        (sum, item) =>
          sum + item.lon,
        0
      ) / countryDestinations.length;


    const codeMap = {
      "Rakousko": "AT",
      "Německo": "DE",
      "Slovinsko": "SI",
      "Itálie": "IT",
      "Chorvatsko": "HR"
    };


    const marker =
      L.marker(
        [lat, lon],
        {
          icon:
            createGroupIcon(
              codeMap[country] || country,
              72
            )
        }
      );


    marker.on("click", () => {

      if (
        countryDestinations.length === 1
      ) {

        map.flyTo(
          [
            countryDestinations[0].lat,
            countryDestinations[0].lon
          ],
          8,
          {
            duration: 1
          }
        );

      } else {

        const bounds =
          L.latLngBounds(
            countryDestinations.map(
              destination => [
                destination.lat,
                destination.lon
              ]
            )
          );


        map.fitBounds(
          bounds,
          {
            padding: [80, 80],
            maxZoom: 8
          }
        );

      }

    });


    marker.addTo(
      countryLayer
    );

  });

}


/* =========================
   DESTINACE
========================= */

function buildDestinations() {

  destinationLayer.clearLayers();


  getVisibleDestinations()
    .forEach(destination => {

      const icon =
        getDestinationIcon(destination);


      const marker =
        L.marker(
          [destination.lat, destination.lon],
          {
            icon:
              createRoundIcon(icon)
          }
        );


      marker.bindPopup(`
        <div style="
          min-width:220px;
          max-width:260px;
        ">

          <strong style="
            font-size:16px;
          ">
            ${destination.name}
          </strong>

          <div style="
            margin-top:4px;
            font-size:12px;
            color:#777;
          ">
            ${destination.country}
            ·
            ${destination.region}
          </div>

          <div style="
            margin-top:7px;
            font-size:11px;
            color:#777;
          ">
            ${
              destination.status ===
              "wishlist"
                ? "★ Chci navštívit"
                : "✓ Navštíveno"
            }
          </div>

          <p style="
            margin:10px 0;
            font-size:13px;
            line-height:1.45;
          ">
            ${destination.description}
          </p>

          <a
            href="place.html?id=${destination.id}"
            style="
              color:#111;
              text-decoration:none;
              font-weight:600;
              font-size:13px;
            "
          >
            Otevřít detail →
          </a>

        </div>
      `);


      marker.addTo(
        destinationLayer
      );

    });

}


/* =========================
   KONKRÉTNÍ BODY PO FILTRU
========================= */

function buildFilteredPoints() {

  filteredPointLayer.clearLayers();


  getVisiblePoints()
    .forEach(point => {

      const info =
        typeInfo[point.type] || {
          label: point.type,
          icon: "📍"
        };


      const marker =
        L.marker(
          [point.lat, point.lon],
          {
            icon:
              createPointIcon(
                point.type
              )
          }
        );


      marker.bindPopup(`
        <div style="
          min-width:220px;
          max-width:260px;
        ">

          <strong style="
            font-size:15px;
          ">
            ${point.name}
          </strong>

          <div style="
            margin-top:4px;
            font-size:12px;
            color:#777;
          ">
            ${info.label}
            ·
            ${point.destinationName}
          </div>

          <p style="
            margin:10px 0;
            font-size:13px;
            line-height:1.45;
          ">
            ${point.description || ""}
          </p>

          <a
            href="place.html?id=${point.destinationId}"
            style="
              color:#111;
              text-decoration:none;
              font-weight:600;
              font-size:13px;
            "
          >
            Otevřít oblast →
          </a>

        </div>
      `);


      marker.addTo(
        filteredPointLayer
      );

    });

}


/* =========================
   SIDEBAR
========================= */

function buildSidebar() {

  const destinationList =
    document.getElementById(
      "destinationList"
    );


  destinationList.innerHTML = "";


  const visible =
    getVisibleDestinations();


  if (visible.length === 0) {

    destinationList.innerHTML = `
      <div class="empty">
        Pro tento filtr zatím nemáš žádná místa.
      </div>
    `;

    return;
  }


  const countries =
    [...new Set(
      visible.map(
        destination =>
          destination.country
      )
    )];


  countries
    .sort()
    .forEach(country => {

      const group =
        document.createElement("div");

      group.className =
        "country-group";


      group.innerHTML = `
        <div class="country-name">
          ${country}
        </div>
      `;


      visible
        .filter(
          destination =>
            destination.country ===
            country
        )
        .forEach(destination => {

          const link =
            document.createElement(
              "a"
            );


          link.href =
            `place.html?id=${destination.id}`;


          link.className =
            "destination-link";


          link.innerHTML = `
            <span class="destination-icon">
              ${getDestinationIcon(destination)}
            </span>

            <span>
              ${destination.name}
            </span>
          `;


          group.appendChild(
            link
          );

        });


      destinationList.appendChild(
        group
      );

    });

}


/* =========================
   FILTRY
========================= */

function buildCategoryFilters() {

  const container =
    document.getElementById(
      "categoryFilters"
    );


  container.innerHTML = "";


  const allButton =
    document.createElement("button");


  allButton.className =
    "filter-button active";

  allButton.dataset.category =
    "all";

  allButton.textContent =
    "Vše";


  container.appendChild(
    allButton
  );


  const usedTypes =
    new Set();


  allPoints.forEach(point => {

    if (
      typeInfo[point.type]
    ) {
      usedTypes.add(
        point.type
      );
    }


    (point.tags || [])
      .forEach(tag => {

        if (typeInfo[tag]) {
          usedTypes.add(tag);
        }

      });

  });


  const order = [
    "coffee",
    "food",
    "parking",
    "toilet",
    "shower",
    "waterfall",
    "swimming",
    "jumping",
    "hike",
    "cycling",
    "paddleboard",
    "sleep",
    "viewpoint",
    "sight",
    "service"
  ];


  order
    .filter(type =>
      usedTypes.has(type)
    )
    .forEach(type => {

      const info =
        typeInfo[type];


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "filter-button";

      button.dataset.category =
        type;

      button.textContent =
        `${info.icon} ${info.label}`;


      container.appendChild(
        button
      );

    });


  container
    .querySelectorAll(
      ".filter-button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          container
            .querySelectorAll(
              ".filter-button"
            )
            .forEach(btn =>
              btn.classList.remove(
                "active"
              )
            );


          button.classList.add(
            "active"
          );


          selectedCategory =
            button.dataset.category;


          refreshEverything();

        }
      );

    });

}


/* =========================

/* =========================
   ZOBRAZENÍ VRSTEV
========================= */

function hideLayers() {

  [
    continentLayer,
    macroLayer,
    countryLayer,
    destinationLayer,
    filteredPointLayer
  ].forEach(layer => {

    if (map.hasLayer(layer)) {
      map.removeLayer(layer);
    }

  });

}


function updateMapMode() {

  hideLayers();


  /*
  Pokud je aktivní konkrétní kategorie,
  ukazujeme rovnou jednotlivé body.
  */

  if (
    selectedCategory !== "all"
  ) {

    map.addLayer(
      filteredPointLayer
    );

    return;
  }


  const zoom =
    map.getZoom();


  if (zoom <= 3) {

    map.addLayer(
      continentLayer
    );

    return;
  }


  if (zoom <= 5) {

    map.addLayer(
      macroLayer
    );

    return;
  }


  if (zoom === 6) {

    map.addLayer(
      countryLayer
    );

    return;
  }


  map.addLayer(
    destinationLayer
  );

}


/* =========================
   REFRESH
========================= */

function refreshEverything() {

  buildMacroRegions();
  buildCountries();
  buildDestinations();
  buildFilteredPoints();
  buildSidebar();

  updateMapMode();


  const description =
    document.getElementById(
      "sidebarDescription"
    );


  if (
    selectedCategory === "all"
  ) {

    description.textContent =
      "Vyber zemi nebo oblast a zobraz místa na mapě.";

  } else {

    const info =
      typeInfo[selectedCategory];


    description.textContent =
      `Zobrazeny jsou konkrétní body: ${info.label.toLowerCase()}.`;

  }

}


/* =========================
   ZOOM
========================= */

map.on(
  "zoomend",
  updateMapMode
);


/* =========================
   MAP SWITCHER
========================= */

const topoButton =
  document.getElementById(
    "topoButton"
  );

const classicButton =
  document.getElementById(
    "classicButton"
  );


topoButton.addEventListener(
  "click",
  () => {

    if (
      !map.hasLayer(topoLayer)
    ) {

      map.removeLayer(
        classicLayer
      );

      topoLayer.addTo(map);

    }


    topoButton.classList.add(
      "active"
    );

    classicButton.classList.remove(
      "active"
    );

  }
);


classicButton.addEventListener(
  "click",
  () => {

    if (
      !map.hasLayer(classicLayer)
    ) {

      map.removeLayer(
        topoLayer
      );

      classicLayer.addTo(map);

    }


    classicButton.classList.add(
      "active"
    );

    topoButton.classList.remove(
      "active"
    );

  }
);


/* =========================
   START
========================= */

buildCategoryFilters();
refreshEverything();

</script>
