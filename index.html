      color: #111;

      font-size: 15px;
      line-height: 1.5;
      color: #666;
    }

      position: relative;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .filter-trigger,
    .filter-option {
      appearance: none;
      border: 1px solid #cfcfc9;
      background: transparent;
      color: #111;
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .nav-button:hover,
    .filter-trigger:hover,
    .filter-option:hover {
      background: #e7e6e1;
    }

    .nav-button.active,
    .filter-trigger.active,
    .filter-option.active {
      background: #111;
      color: white;
      border-color: #111;
    }

      position: absolute;
      z-index: 2200;
      top: calc(100% + 8px);
      right: 0;
      width: 250px;
      max-height: 390px;
      overflow-y: auto;
      background: rgba(255,255,255,0.98);
      border: 1px solid #deddd7;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.14);
      padding: 8px;
      display: none;
    }

    .filter-menu.open {
      display: block;
    }

    .filter-menu-title {
      padding: 8px 10px 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #888;
    }

    .filter-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      padding: 9px 10px;
      text-align: left;
      margin-bottom: 2px;
    }

      padding: 0 20px 18px;
    }

    .travel-container {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);

      display: flex;

      text-align: left;

/* =========================

========================= */

const allPoints = [];


destinations.forEach(destination => {

  (destination.points || [])
    .forEach(point => {

      allPoints.push({

        ...point,

        destinationId:
          destination.id,

        destinationName:

        destinationCountry:

        destinationRegion:

      });

function createRoundIcon(icon) {

  return L.divIcon({

    className: "",

    html: `
      <div class="destination-marker">
        ${icon}
      </div>
    `,

    iconSize: [42, 42],
    iconAnchor: [21, 21],
    popupAnchor: [0, -23]

  });

}


function createPointIcon(point) {

  if (
    point.type === "parking" &&
    point.tags &&
    point.tags.includes("paid")
  ) {

    return L.divIcon({

      className: "",

      html: `
        <div class="point-marker">
          💰
        </div>
      `,

      iconSize: [42, 42],
      iconAnchor: [21, 21],
      popupAnchor: [0, -23]

    });

  const info =
    typeInfo[point.type] || {
      icon: "📍"
    };


  return L.divIcon({

    className: "",

    html: `
      <div class="point-marker">
        ${info.icon}
      </div>
    `,

    iconSize: [42, 42],
    iconAnchor: [21, 21],
    popupAnchor: [0, -23]

  });

}


function createCountryIcon(text) {

    className: "",

        ${text}
      </div>
    `,

    iconSize: [58, 38],
    iconAnchor: [29, 19]

  });

/* =========================
   POMOCNÉ FUNKCE
========================= */

function destinationMatchesMode(destination) {

  if (selectedMode === "all") {
    return true;
  }


  if (selectedMode === "wishlist") {
    return destination.wishlist === true;
  }


  return true;

}


function pointMatchesMode(point) {

  if (selectedMode === "all") {
    return true;
  }


  if (selectedMode === "wishlist") {

    const destination =
      destinations.find(
        item =>
          item.id === point.destinationId
      );


    return (
      destination &&
      destination.wishlist === true
    );

  }


  return true;

}


function pointMatchesCategory(point) {

  if (selectedCategory === "all") {
    return true;
  }


  if (point.type === selectedCategory) {
    return true;
  }


  return (
    point.tags &&
    point.tags.includes(
      selectedCategory
    )
  );

}


function destinationContainsCategory(destination) {

  if (selectedCategory === "all") {
    return true;
  }


  if (
    destination.tags &&
    destination.tags.includes(
      selectedCategory
    )
  ) {
    return true;
  }


  if (
    (destination.points || [])
      .some(point =>
        point.type === selectedCategory ||
        (
          point.tags &&
          point.tags.includes(
            selectedCategory
          )
        )
      )
  ) {
    return true;
  }


  if (
    (destination.routes || [])
      .some(route =>
        route.type === selectedCategory
      )
  ) {
    return true;
  }


  return false;

}


function getDestinationIcon(destination) {

  if (
    selectedCategory ===
    "highest-point"
  ) {
    return "🏔️";
  }


  const tags =
    destination.tags || [];


  for (const tag of tags) {

    if (destinationIcons[tag]) {
      return destinationIcons[tag];
    }

  }


  return "📍";

}


function getVisibleDestinations() {

  return destinations.filter(
    destination =>
      destinationMatchesMode(
        destination
      ) &&
      destinationContainsCategory(
        destination
      )
  );

}


function getVisiblePoints() {

  return allPoints.filter(
    point =>
      pointMatchesMode(point) &&
      pointMatchesCategory(point)
  );

}


function getCountryCenter(
  country,
  countryDestinations
) {

  if (countryConfig[country]) {

    return [
      countryConfig[country].lat,
      countryConfig[country].lon
    ];

  }


  const lat =
    countryDestinations.reduce(
      (sum, item) =>
        sum + item.lat,
      0
    ) /
    countryDestinations.length;


  const lon =
    countryDestinations.reduce(
      (sum, item) =>
        sum + item.lon,
      0
    ) /
    countryDestinations.length;


  return [lat, lon];

}


function getCountryCode(country) {

  if (countryConfig[country]) {
    return countryConfig[country].code;
  }


  return country
    .substring(0, 2)
    .toUpperCase();

}


/* =========================
   ZEMĚ
========================= */

function buildCountries() {

  countryLayer.clearLayers();


  const visible =
    getVisibleDestinations();


  const countryNames =
    [...new Set(
      visible.map(
        destination =>
          destination.country
      )
    )];


  countryNames
    .sort((a, b) =>
      a.localeCompare(
        b,
        "cs"
      )
    )
    .forEach(country => {

      const countryDestinations =
        visible.filter(
          destination =>
            destination.country ===
            country
        );


      if (
        countryDestinations.length === 0
      ) {
        return;
      }


      const center =
        getCountryCenter(
          country,
          countryDestinations
        );


      const marker =
        L.marker(
          center,
          {
            icon:
              createCountryIcon(
                getCountryCode(country)
              )
          }
        );


      marker.on(
        "click",
        () => {

          if (
            countryDestinations.length === 1
          ) {

            map.flyTo(
              [
                countryDestinations[0].lat,
                countryDestinations[0].lon
              ],
              8,
              {
                duration: 0.8
              }
            );

          } else {

            const bounds =
              L.latLngBounds(
                countryDestinations.map(
                  destination => [
                    destination.lat,
                    destination.lon
                  ]
                )
              );


            map.fitBounds(
              bounds,
              {
                padding: [70, 70],
                maxZoom: 8
              }
            );

          }

        }
      );


      marker.addTo(
        countryLayer
      );

    });

}


/* =========================
   DESTINACE
========================= */

function buildDestinations() {

  destinationLayer.clearLayers();


  getVisibleDestinations()
    .forEach(destination => {

      const marker =
        L.marker(
          [
            destination.lat,
            destination.lon
          ],
          {
            icon:
              createRoundIcon(
                getDestinationIcon(
                  destination
                )
              )
          }
        );


      marker.bindPopup(`

        <div style="
          min-width:220px;
          max-width:260px;
        ">

          <strong style="
            font-size:16px;
          ">
            ${destination.name}
          </strong>

          <div style="
            margin-top:4px;
            font-size:12px;
            color:#777;
          ">
            ${destination.country}
            ·
            ${destination.region}
          </div>

          ${
            destination.wishlist === true
              ? `
                <div style="
                  margin-top:7px;
                  font-size:11px;
                  color:#777;
                ">
                  ★ Wishlist
                </div>
              `
              : ""
          }

          <p style="
            margin:10px 0;
            font-size:13px;
            line-height:1.45;
          ">
            ${destination.description}
          </p>

          <a
            href="place.html?id=${destination.id}"
            style="
              color:#111;
              text-decoration:none;
              font-weight:600;
              font-size:13px;
            "
          >
            Otevřít detail →
          </a>

        </div>

      `);


      marker.addTo(
        destinationLayer
      );

    });

}


/* =========================
   KONKRÉTNÍ BODY
========================= */

function buildFilteredPoints() {

  filteredPointLayer.clearLayers();


  getVisiblePoints()
    .forEach(point => {

      let label =
        (
          typeInfo[point.type] ||
          {
            label: point.type
          }
        ).label;


      if (
        point.type === "parking" &&
        point.tags &&
        point.tags.includes("paid")
      ) {
        label =
          "Placené parkoviště";
      }


      const marker =
        L.marker(
          [
            point.lat,
            point.lon
          ],
          {
            icon:
              createPointIcon(
                point
              )
          }
        );


      marker.bindPopup(`

        <div style="
          min-width:220px;
          max-width:260px;
        ">

          <strong style="
            font-size:15px;
          ">
            ${point.name}
          </strong>

          <div style="
            margin-top:4px;
            font-size:12px;
            color:#777;
          ">
            ${label}
            ·
            ${point.destinationName}
          </div>

          <p style="
            margin:10px 0;
            font-size:13px;
            line-height:1.45;
          ">
            ${point.description || ""}
          </p>

          <a
            href="place.html?id=${point.destinationId}"
            style="
              color:#111;
              text-decoration:none;
              font-weight:600;
              font-size:13px;
            "
          >
            Otevřít oblast →
          </a>

        </div>

      `);


      marker.addTo(
        filteredPointLayer
      );

    });

}


/* =========================
   SIDEBAR
========================= */

function buildSidebar() {

  const destinationList =
    document.getElementById(
      "destinationList"
    );


  destinationList.innerHTML =
    "";


  const visible =
    getVisibleDestinations()
      .slice()
      .sort((a, b) =>
        a.name.localeCompare(
          b.name,
          "cs"
        )
      );


  document.getElementById(
    "placesCount"
  ).textContent =
    visible.length;


  if (
    visible.length === 0
  ) {

    destinationList.innerHTML = `
      <div class="empty">
        Pro tento filtr zatím nemáš žádná místa.
      </div>
    `;

    return;

  }


  const countries =
    [...new Set(
      visible.map(
        destination =>
          destination.country
      )
    )]
      .sort((a, b) =>
        a.localeCompare(
          b,
          "cs"
        )
      );


  countries.forEach(
    country => {

      const group =
        document.createElement(
          "div"
        );


      group.className =
        "country-group";


      group.innerHTML = `
        <div class="country-name">
          ${country}
        </div>
      `;


      visible
        .filter(
          destination =>
            destination.country ===
            country
        )
        .sort((a, b) =>
          a.name.localeCompare(
            b.name,
            "cs"
          )
        )
        .forEach(
          destination => {

            const link =
              document.createElement(
                "a"
              );


            link.href =
              `place.html?id=${destination.id}`;


            link.className =
              "destination-link";


            link.innerHTML = `

              <span class="destination-icon">
                ${getDestinationIcon(destination)}
              </span>

              <span>
                ${destination.name}
              </span>

            `;


            group.appendChild(
              link
            );

          }
        );


      destinationList.appendChild(
        group
      );

    }
  );

}


/* =========================
   FILTRY
========================= */

function buildCategoryFilters() {

  const container =
    document.getElementById(
      "categoryFilters"
    );


  container.innerHTML =
    "";


  const definitions =
    [];


  Object.entries(typeInfo)
    .forEach(
      ([key, info]) => {

        let used =
          false;


        destinations.forEach(
          destination => {

            if (
              destination.tags &&
              destination.tags.includes(
                key
              )
            ) {
              used = true;
            }


            if (
              (destination.points || [])
                .some(point =>
                  point.type === key ||
                  (
                    point.tags &&
                    point.tags.includes(
                      key
                    )
                  )
                )
            ) {
              used = true;
            }


            if (
              (destination.routes || [])
                .some(route =>
                  route.type === key
                )
            ) {
              used = true;
            }

          }
        );


        if (used) {

          definitions.push({
            key,
            label: info.label,
            icon: info.icon
          });

        }

      }
    );


  definitions.sort(
    (a, b) =>
      a.label.localeCompare(
        b.label,
        "cs"
      )
  );


  const allButton =
    document.createElement(
      "button"
    );


  allButton.className =
    "filter-option active";


  allButton.dataset.category =
    "all";


  allButton.innerHTML =
    `
      <span>✕</span>
      <span>Bez filtru</span>
    `;


  container.appendChild(
    allButton
  );


  definitions.forEach(
    def => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "filter-option";


      button.dataset.category =
        def.key;


      button.innerHTML = `

        <span>
          ${def.icon}
        </span>

        <span>
          ${def.label}
        </span>

      `;


      container.appendChild(
        button
      );

    }
  );


  container
    .querySelectorAll(
      ".filter-option"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            container
              .querySelectorAll(
                ".filter-option"
              )
              .forEach(
                btn =>
                  btn.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );


            selectedCategory =
              button.dataset.category;


            const trigger =
              document.getElementById(
                "filterTrigger"
              );


            if (
              selectedCategory ===
              "all"
            ) {

              trigger.textContent =
                "⚙ Filtry";


              trigger.classList.remove(
                "active"
              );

            } else {

              const info =
                typeInfo[
                  selectedCategory
                ];


              trigger.textContent =
                `${info.icon} ${info.label} ×`;


              trigger.classList.add(
                "active"
              );

            }


            document
              .getElementById(
                "filterMenu"
              )
              .classList.remove(
                "open"
              );


            refreshEverything(
              true
            );

          }
        );

      }
    );

}


/* =========================
   STATUS / WISHLIST
========================= */

document
  .querySelectorAll(
    ".nav-button[data-mode]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".nav-button[data-mode]"
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          selectedMode =
            button.dataset.mode;


          refreshEverything(
            true
          );

        }
      );

    }
  );


/* =========================
   ZOBRAZENÍ VRSTEV
========================= */

function hideLayers() {

  [
    countryLayer,
    destinationLayer,
    filteredPointLayer
  ]
    .forEach(
      layer => {

        if (
          map.hasLayer(layer)
        ) {
          map.removeLayer(
            layer
          );
        }

      }
    );

}


function updateMapMode() {

  hideLayers();


  if (
    selectedCategory !== "all" &&
    destinationLevelCategories.has(
      selectedCategory
    )
  ) {

    map.addLayer(
      destinationLayer
    );

    return;

  }


  if (
    selectedCategory !== "all"
  ) {

    map.addLayer(
      filteredPointLayer
    );

    return;

  }


  const zoom =
    map.getZoom();


  if (
    zoom <= 6
  ) {

    map.addLayer(
      countryLayer
    );

    return;

  }


  map.addLayer(
    destinationLayer
  );

}


/* =========================
   FIT MAPY
========================= */

function fitMapToCurrentSelection() {

  let coordinates =
    [];


  if (
    selectedCategory !== "all" &&
    !destinationLevelCategories.has(
      selectedCategory
    )
  ) {

    coordinates =
      getVisiblePoints()
        .map(
          point => [
            point.lat,
            point.lon
          ]
        );

  } else {

    coordinates =
      getVisibleDestinations()
        .map(
          destination => [
            destination.lat,
            destination.lon
          ]
        );

  }


  if (
    coordinates.length === 0
  ) {
    return;
  }


  if (
    coordinates.length === 1
  ) {

    map.setView(
      coordinates[0],
      8
    );

    return;

  }


  const bounds =
    L.latLngBounds(
      coordinates
    );


  map.fitBounds(
    bounds,
    {
      padding: [45, 45],
      maxZoom: 7
    }
  );

}


/* =========================
   REFRESH
========================= */

function refreshEverything(
  fitMap = false
) {

  buildCountries();
  buildDestinations();
  buildFilteredPoints();
  buildSidebar();

  updateMapMode();


  const description =
    document.getElementById(
      "sidebarDescription"
    );


  if (
    selectedCategory === "all"
  ) {

    description.textContent =
      "Vyber místo ze seznamu nebo přímo z mapy.";

  }

  else if (
    selectedCategory ===
    "highest-point"
  ) {

    description.textContent =
      "Nejvyšší body evropských států a připravené plány výstupů.";

  }

  else if (
    destinationLevelCategories.has(
      selectedCategory
    )
  ) {

    description.textContent =
      `Zobrazené destinace: ${typeInfo[selectedCategory].label.toLowerCase()}.`;

  }

  else {

    description.textContent =
      `Zobrazené konkrétní body: ${typeInfo[selectedCategory].label.toLowerCase()}.`;

  }


  if (fitMap) {

    setTimeout(
      fitMapToCurrentSelection,
      0
    );

  }

}


/* =========================
   ROZBALOVACÍ MÍSTA
========================= */

const placesToggle =
  document.getElementById(
    "placesToggle"
  );


const placesPanel =
  document.getElementById(
    "placesPanel"
  );


placesToggle.addEventListener(
  "click",
  () => {

    const open =
      placesPanel.classList.toggle(
        "open"
      );


    placesToggle.classList.toggle(
      "open",
      open
    );

  }
);


/* =========================
   ROZBALOVACÍ FILTRY
========================= */

const filterTrigger =
  document.getElementById(
    "filterTrigger"
  );


const filterMenu =
  document.getElementById(
    "filterMenu"
  );


filterTrigger.addEventListener(
  "click",
  event => {

    event.stopPropagation();


    filterMenu.classList.toggle(
      "open"
    );

  }
);


filterMenu.addEventListener(
  "click",
  event => {

    event.stopPropagation();

  }
);


document.addEventListener(
  "click",
  () => {

    filterMenu.classList.remove(
      "open"
    );

  }
);


/* =========================
   ZOOM
========================= */

map.on(
  "zoomend",
  updateMapMode
);


/* =========================
   MAP SWITCHER
========================= */

const topoButton =
  document.getElementById(
    "topoButton"
  );


const classicButton =
  document.getElementById(
    "classicButton"
  );


topoButton.addEventListener(
  "click",
  () => {

    if (
      !map.hasLayer(
        topoLayer
      )
    ) {

      map.removeLayer(
        classicLayer
      );


      topoLayer.addTo(
        map
      );

    }


    topoButton.classList.add(
      "active"
    );


    classicButton.classList.remove(
      "active"
    );

  }
);


classicButton.addEventListener(
  "click",
  () => {

    if (
      !map.hasLayer(
        classicLayer
      )
    ) {

      map.removeLayer(
        topoLayer
      );


      classicLayer.addTo(
        map
      );

    }


    classicButton.classList.add(
      "active"
    );


    topoButton.classList.remove(
      "active"
    );

  }
);


/* =========================
   START
========================= */

buildCategoryFilters();

refreshEverything();


setTimeout(
  () => {

    map.invalidateSize();

    fitMapToCurrentSelection();

  },
  0
);

</script>
